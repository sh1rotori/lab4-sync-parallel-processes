name: Linux Build & Concurrency Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Stress Test (Ubuntu 22.04 LTS)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make python3 python3-pip python3-matplotlib

      - name: Strict Compilation (-Wall -Wextra -Werror -pedantic)
        run: |
          make clean
          make all

      - name: Run All Synchronization Test Suites
        run: |
          make run-all

      - name: Execute Automated Benchmark Suite
        run: |
          python3 scripts/benchmark.py
